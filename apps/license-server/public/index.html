<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>License Admin</title>
<style>
  :root { --bg:#f5f5f3; --surface:#fff; --border:#e6e5e1; --text:#16171a; --muted:#6b6d74; --accent:#d42a20; --green:#1a8a4a; --amber:#b26a00; --red:#c8251b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0e10; --surface:#151619; --border:#26272c; --text:#ececee; --muted:#9a9ca3; --accent:#e5483e; --green:#3dbb75; --amber:#e2a336; --red:#f0645b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:13.5px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:#1c1d20; color:#fff; }
  header .logo { width:28px; height:28px; border-radius:7px; background:var(--accent); display:grid; place-items:center; font-weight:700; }
  header b { font-weight:650; } header .sp { flex:1; }
  main { max-width:1180px; margin:0 auto; padding:24px 16px 60px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .card h3 { margin:0; padding:14px 18px; border-bottom:1px solid var(--border); font-size:14px; display:flex; align-items:center; gap:8px; }
  .card .b { padding:16px 18px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .stat .v { font-size:22px; font-weight:650; } .stat .l { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { font-size:11.5px; color:var(--muted); font-weight:600; background:color-mix(in srgb, var(--surface) 92%, var(--text)); }
  input, select, textarea { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 10px; width:100%; }
  button { font:inherit; font-weight:600; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.danger { color:var(--red); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  label { font-size:12px; font-weight:600; display:flex; flex-direction:column; gap:4px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:600; background:color-mix(in srgb, var(--muted) 15%, transparent); }
  .pill.active { color:var(--green); background:color-mix(in srgb, var(--green) 14%, transparent); } .pill.expired, .pill.revoked { color:var(--red); background:color-mix(in srgb, var(--red) 12%, transparent); } .pill.suspended { color:var(--amber); background:color-mix(in srgb, var(--amber) 14%, transparent); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; } .muted { color:var(--muted); }
  #login { max-width:360px; margin:12vh auto; } .hidden { display:none !important; }
  #toast { position:fixed; bottom:18px; right:18px; background:var(--text); color:var(--bg); padding:10px 14px; border-radius:8px; display:none; max-width:420px; }
  dialog { border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text); width:min(760px, 92vw); padding:0; }
  dialog .b { padding:18px; max-height:70vh; overflow:auto; } dialog::backdrop { background:rgba(0,0,0,.4); }
  @media (max-width: 760px) { .grid, .stats { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header><div class="logo">L</div><b>Lead Getter Enterprise</b><span class="muted" style="color:#9d9fa6">License administration</span><span class="sp"></span><button id="logout" class="hidden">Sign out</button></header>
<main>
  <div id="login" class="card"><h3>Sign in</h3><div class="b">
    <form id="loginForm" style="display:flex;flex-direction:column;gap:10px">
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Sign in</button>
    </form></div></div>

  <div id="appView" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card"><h3>Issue a license</h3><div class="b">
      <form id="createForm" class="grid">
        <label>Plan<select name="planCode" id="planSelect"></select></label>
        <label>Customer name<input name="customerName"></label>
        <label>Customer email<input name="customerEmail" type="email"></label>
        <label>Max devices<input name="maxDevices" type="number" min="1" placeholder="Plan default"></label>
        <label style="grid-column:span 3">Notes<input name="notes" placeholder="Payment reference, etc."></label>
        <label style="justify-content:flex-end"><span class="row"><input type="checkbox" name="sendEmail" checked style="width:auto"> Email the key</span><button class="primary" type="submit">Create license</button></label>
      </form></div></div>
    <div class="card"><h3>Licenses <span class="sp" style="flex:1"></span><input id="search" placeholder="Search key, email or name" style="max-width:280px"></h3>
      <div style="overflow:auto"><table><thead><tr><th>Key</th><th>Customer</th><th>Plan</th><th>Status</th><th>Expires</th><th>Devices</th><th></th></tr></thead><tbody id="licenses"></tbody></table></div></div>
    <div class="card"><h3>Plans &amp; pricing</h3><div style="overflow:auto"><table><thead><tr><th>Code</th><th>Name</th><th>Price</th><th>Currency</th><th>Months (blank = lifetime)</th><th>Label</th><th>Devices</th><th>Active</th><th></th></tr></thead><tbody id="plans"></tbody></table></div></div>
  </div>
</main>
<dialog id="detail"><div class="b" id="detailBody"></div><div class="b row" style="border-top:1px solid var(--border);justify-content:flex-end"><button onclick="detail.close()">Close</button></div></dialog>
<div id="toast"></div>
<script>
  const $ = (s) => document.querySelector(s)
  let token = sessionStorage.getItem('lge_admin') || ''
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 4000) }
  async function api(path, opts = {}) {
    const r = await fetch('/api/admin' + path, { ...opts, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: opts.body ? JSON.stringify(opts.body) : undefined })
    const j = await r.json().catch(() => ({}))
    if (r.status === 401 && path !== '/login') { logout(); throw new Error('Session expired') }
    if (!r.ok) throw new Error(j.error || 'Request failed')
    return j
  }
  function logout() { token = ''; sessionStorage.removeItem('lge_admin'); $('#appView').classList.add('hidden'); $('#logout').classList.add('hidden'); $('#login').classList.remove('hidden') }
  $('#logout').onclick = logout
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault()
    const f = Object.fromEntries(new FormData(e.target))
    try { token = (await api('/login', { method: 'POST', body: f })).token; sessionStorage.setItem('lge_admin', token); boot() } catch (err) { toast(err.message) }
  }
  const fmt = (d) => (d ? new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Lifetime')
  async function loadStats() {
    const s = await api('/stats')
    $('#stats').innerHTML = [['Licenses', s.licenses], ['Active', s.active], ['Expired', s.expired], ['Active devices', s.devices]].map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')
  }
  async function loadPlans() {
    const { plans } = await api('/plans')
    $('#planSelect').innerHTML = plans.filter((p) => p.active).map((p) => `<option value="${esc(p.code)}">${esc(p.name)} — ${esc(p.currency)} ${p.price.toLocaleString()}</option>`).join('')
    $('#plans').innerHTML = plans.map((p) => `<tr data-id="${p.id}"><td class="mono">${esc(p.code)}</td><td><input data-k="name" value="${esc(p.name)}"></td><td><input data-k="price" type="number" value="${p.price}"></td><td><input data-k="currency" value="${esc(p.currency)}" style="width:70px"></td><td><input data-k="duration_months" type="number" value="${p.duration_months ?? ''}"></td><td><input data-k="duration_label" value="${esc(p.duration_label)}"></td><td><input data-k="max_devices" type="number" value="${p.max_devices}" style="width:70px"></td><td><input data-k="active" type="checkbox" ${p.active ? 'checked' : ''} style="width:auto"></td><td><button onclick="savePlan(${p.id}, this)">Save</button></td></tr>`).join('')
  }
  window.savePlan = async (id, btn) => {
    const tr = btn.closest('tr'); const body = {}
    tr.querySelectorAll('[data-k]').forEach((i) => (body[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? (i.value === '' ? null : Number(i.value)) : i.value))
    try { await api('/plans/' + id, { method: 'PATCH', body }); toast('Plan saved'); loadPlans() } catch (e) { toast(e.message) }
  }
  async function loadLicenses() {
    const { licenses } = await api('/licenses?search=' + encodeURIComponent($('#search').value))
    $('#licenses').innerHTML = licenses.map((l) => `<tr><td class="mono">${esc(l.license_key)}</td><td>${esc(l.customer_name || '')}<div class="muted">${esc(l.customer_email || '')}</div></td><td>${esc(l.plan_name)}</td><td><span class="pill ${esc(l.effective_status)}">${esc(l.effective_status)}</span></td><td>${fmt(l.expires_at)}</td><td>${l.devices}/${l.max_devices}</td><td class="row"><button onclick="openLicense(${l.id})">Manage</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No licenses yet.</td></tr>'
  }
  $('#search').oninput = () => { clearTimeout(window._s); window._s = setTimeout(loadLicenses, 250) }
  $('#createForm').onsubmit = async (e) => {
    e.preventDefault()
    const f = Object.fromEntries(new FormData(e.target))
    const body = { planCode: f.planCode, customerName: f.customerName || null, customerEmail: f.customerEmail || null, notes: f.notes || null, sendEmail: !!f.sendEmail, ...(f.maxDevices ? { maxDevices: Number(f.maxDevices) } : {}) }
    try { const r = await api('/licenses', { method: 'POST', body }); toast('Created ' + r.licenseKey); e.target.reset(); loadLicenses(); loadStats() } catch (err) { toast(err.message) }
  }
  window.openLicense = async (id) => {
    const d = await api('/licenses/' + id); const l = d.license
    const { plans } = await api('/plans')
    $('#detailBody').innerHTML = `<h3 style="margin:0 0 4px" class="mono">${esc(l.license_key)}</h3><div class="muted">${esc(l.customer_name || '')} ${esc(l.customer_email || '')} · ${esc(l.plan_name)} · <span class="pill ${esc(l.effective_status)}">${esc(l.effective_status)}</span> · expires ${fmt(l.expires_at)}</div>
      <div class="row" style="margin:14px 0"><select id="renewPlan" style="width:auto">${plans.filter((p) => p.active).map((p) => `<option value="${esc(p.code)}">${esc(p.name)}</option>`).join('')}</select><button class="primary" onclick="renew(${l.id})">Renew / change plan</button>
      ${l.status !== 'active' ? `<button onclick="setStatus(${l.id}, 'active')">Reactivate</button>` : `<button onclick="setStatus(${l.id}, 'suspended')">Suspend</button>`}<button class="danger" onclick="if(confirm('Revoke this license? Devices stop working at the next check.'))setStatus(${l.id}, 'revoked')">Revoke</button></div>
      <h4>Devices</h4><table><thead><tr><th>Activation</th><th>Device</th><th>Platform</th><th>Last seen</th><th></th></tr></thead><tbody>${d.activations.map((a) => `<tr><td class="mono">${esc(a.activation_id)}</td><td>${esc(a.device_name || '')}<div class="mono muted">${esc(a.device_id)}</div></td><td>${esc(a.platform || '')} ${esc(a.app_version || '')}</td><td>${esc(a.last_seen_at)}</td><td>${a.active ? `<button class="danger" onclick="deact(${a.id}, ${l.id})">Deactivate</button>` : '<span class="muted">inactive</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No devices</td></tr>'}</tbody></table>
      <h4>History</h4><table><tbody>${d.events.map((e) => `<tr><td>${esc(e.created_at)}</td><td>${esc(e.event)}</td><td class="muted">${esc(e.actor)}</td><td class="mono muted">${esc(e.detail || '')}</td></tr>`).join('')}</tbody></table>
      <h4>Emails</h4><table><tbody>${d.notifications.map((n) => `<tr><td>${esc(n.created_at)}</td><td>${esc(n.kind)}</td><td>${esc(n.status)}</td><td class="muted">${esc(n.error || '')}</td></tr>`).join('') || '<tr><td class="muted">None</td></tr>'}</tbody></table>`
    $('#detail').showModal()
  }
  window.renew = async (id) => { try { const r = await api(`/licenses/${id}/renew`, { method: 'POST', body: { planCode: $('#renewPlan').value } }); toast('Renewed — expires ' + fmt(r.expiresAt)); openLicense(id); loadLicenses() } catch (e) { toast(e.message) } }
  window.setStatus = async (id, status) => { try { await api(`/licenses/${id}/status`, { method: 'POST', body: { status } }); toast('Status: ' + status); openLicense(id); loadLicenses(); loadStats() } catch (e) { toast(e.message) } }
  window.deact = async (aid, id) => { try { await api('/activations/' + aid, { method: 'DELETE' }); toast('Device deactivated'); openLicense(id); loadLicenses(); loadStats() } catch (e) { toast(e.message) } }
  async function boot() {
    $('#login').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#logout').classList.remove('hidden')
    try { await Promise.all([loadStats(), loadPlans(), loadLicenses()]) } catch (e) { toast(e.message) }
  }
  if (token) boot()
</script>
</body>
</html>
