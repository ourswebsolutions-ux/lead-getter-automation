# Reacher email verification backend (https://github.com/reacherhq/check-if-email-exists)
# Run on a server whose provider allows OUTBOUND TCP port 25 (most home ISPs block it).
# Usage:  cp .env.example .env && docker compose up -d
services:
  reacher:
    image: reacherhq/backend:latest   # pin a specific version tag in production
    container_name: reacher
    restart: unless-stopped
    ports:
      - "${REACHER_PORT:-8080}:8080"
    environment:
      RCH__HTTP_HOST: 0.0.0.0
      # Requests must send this value in the `x-reacher-secret` header (set the same value in the app).
      RCH__HEADER_SECRET: ${REACHER_SECRET}
      # Identity used in the SMTP conversation — use a real domain you control with valid DNS.
      RCH__FROM_EMAIL: ${REACHER_FROM_EMAIL}
      RCH__HELLO_NAME: ${REACHER_HELLO_NAME}
      # Keep concurrency modest to avoid being throttled by mail servers.
      RCH__WORKER__ENABLE: "false"
      RUST_LOG: info
